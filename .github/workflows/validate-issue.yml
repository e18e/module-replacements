name: Validate Issue

on:
  issues:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    if: startsWith(github.event.issue.title, '[Replacement]:')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Issue
        id: validate
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node scripts/validate-issue.ts
      - name: Comment on Issue
        if: steps.validate.outcome == 'failure' && hashFiles('issue-validation-failure.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file issue-validation-failure.md
      - name: Fail if Validation Failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
